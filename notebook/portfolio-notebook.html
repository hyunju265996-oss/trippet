<style>
  :root{
    --bg:#0b0806; --ink:#F3EADB; --muted:#BFAE93; --gold:#D9B26A; --gold2:#F1D9A0;
    --glass:rgba(17,11,8,.74); --line:rgba(217,178,106,.22);
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --serif:'Noto Serif KR', serif; --en:'Cormorant Garamond', 'Noto Serif KR', serif;
  }
  *{box-sizing:border-box}
  html{scroll-snap-type:y mandatory;background:var(--bg)}
  html.locked{overflow:hidden}
  html,body{margin:0;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{background:var(--bg)}
  body.wand-on, body.wand-on *{cursor:none !important}
  #scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:pan-y}
  #fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:40}
  #spacer section{height:100vh;scroll-snap-align:start;scroll-snap-stop:always}

  /* 영화 같은 비네트 */
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}

  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:22px 30px;z-index:20;pointer-events:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  header b{color:var(--gold);font-weight:600}

  /* 시작 화면 문구 */
  .intro{position:fixed;left:50%;top:9vh;transform:translateX(-50%);z-index:20;text-align:center;pointer-events:none;width:min(92vw,760px);transition:opacity .9s ease, transform .9s ease}
  .intro.gone{opacity:0;transform:translate(-50%,-14px)}
  .intro .eb{font-family:var(--en);font-style:italic;font-size:20px;letter-spacing:.06em;color:var(--gold)}
  .intro h1{font-family:var(--serif);font-weight:600;font-size:clamp(26px,3.4vw,42px);line-height:1.45;margin:12px 0 0;color:#F6EBD6;text-shadow:0 2px 24px rgba(0,0,0,.6)}
  .intro h1 em{font-style:normal;color:var(--gold2)}

  /* 하단 바 */
  .bar{position:fixed;left:20px;right:20px;bottom:18px;z-index:30;background:var(--glass);backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.45);transition:opacity .6s, transform .6s}
  .bar.dim{opacity:.0;transform:translateY(20px);pointer-events:none}
  .bar-main{display:flex;align-items:center;gap:22px;height:64px;padding:0 14px 0 22px}
  .b-info{flex:1 1 auto;min-width:0;display:flex;align-items:baseline;gap:14px;white-space:nowrap;overflow:hidden}
  .b-kind{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;flex-shrink:0}
  .b-title{font-family:var(--serif);font-weight:600;font-size:18px;color:#F6EBD6;flex-shrink:0}
  .b-mvp{font-size:14px;color:#D9CCB4;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .b-dots{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .b-dots .gap{width:8px}
  .b-dots button{all:unset;display:block;width:16px;height:22px;position:relative}
  .b-dots button::after{content:"";position:absolute;left:3px;right:3px;top:9px;height:4px;border-radius:2px;background:rgba(217,178,106,.22);transition:background .4s,height .25s,top .25s}
  .b-dots button.filled::after{background:rgba(217,178,106,.75)}
  .b-dots button.cur::after{background:var(--gold2);top:7px;height:8px;box-shadow:0 0 10px rgba(241,217,160,.8)}
  .b-dots button:focus-visible{outline:1px solid var(--gold2);border-radius:3px}
  .b-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .meter{display:flex;flex-direction:column;gap:5px;min-width:132px}
  .meter span{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
  .meter span b{color:var(--gold2);font-weight:600}
  .meter i{display:block;height:3px;border-radius:2px;background:rgba(217,178,106,.18);overflow:hidden}
  .meter i u{display:block;height:100%;width:0;background:linear-gradient(90deg,#9b7130,#f3dc9f);transition:width .5s}
  .btn{font:600 12px var(--mono);letter-spacing:.08em;color:var(--ink);background:rgba(255,240,210,.06);border:1px solid var(--line);border-radius:999px;padding:9px 13px;white-space:nowrap}
  .btn:hover{background:rgba(255,240,210,.12)}
  .btn:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
  .btn.gold{background:var(--gold);color:#1d140d;border-color:var(--gold)}
  .drawer{max-height:0;overflow:hidden;transition:max-height .45s ease}
  .bar.open .drawer{max-height:46vh}
  .drawer-in{padding:4px 24px 20px;border-top:1px solid var(--line);max-height:46vh;overflow:auto;display:grid;grid-template-columns:1.1fr 1fr;gap:10px 40px}
  .drawer h3{font-family:var(--serif);font-size:20px;margin:16px 0 6px;color:#F6EBD6}
  .drawer .lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--gold);text-transform:uppercase;margin-top:16px}
  .drawer p{font-size:15px;line-height:1.75;color:#E2D6C0;margin:6px 0 0;white-space:pre-line}
  .drawer .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .drawer .tags span{font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:#E8DCC4}
  .drawer dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:8px 0 0;font-size:14px}
  .drawer dt{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding-top:2px}
  .drawer dd{margin:0}
  .hint{font-family:var(--en);font-style:italic;font-size:16px;color:var(--gold2)}

  /* 감사 인사 */
  .thanks{position:fixed;inset:0;z-index:35;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity 1.6s ease;background:radial-gradient(ellipse at 50% 50%,rgba(8,5,3,.35),rgba(8,5,3,.82) 70%)}
  .thanks.show{opacity:1;pointer-events:auto}
  .thanks .in{width:min(90vw,640px);max-height:100vh;overflow:auto;padding:24px 0;transform:translateY(16px);transition:transform 1.6s ease}
  .thanks.show .in{transform:none}
  .thanks .eb{font-family:var(--en);font-style:italic;font-size:20px;letter-spacing:.08em;color:var(--gold)}
  .thanks .sub{font-family:var(--serif);font-size:18px;color:#D9CCB4;margin-top:18px}
  .thanks h2{font-family:var(--serif);font-weight:900;font-size:clamp(40px,6vw,68px);margin:6px 0 18px;color:#F6EBD6;letter-spacing:-.01em;text-shadow:0 0 40px rgba(241,217,160,.25)}
  .thanks p{font-size:16px;line-height:1.85;color:#E6DAC4;white-space:pre-line;margin:0}
  .thanks .rule{width:120px;height:1px;margin:26px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .thanks dl{display:inline-grid;grid-template-columns:auto auto;gap:6px 18px;text-align:left;margin:0 0 22px;font-size:14.5px}
  .thanks dt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;padding-top:3px}
  .thanks dd{margin:0}

  /* 지팡이 커서 */
  #wand{position:fixed;left:0;top:0;z-index:60;pointer-events:none;width:150px;height:150px;transform-origin:6px 6px;will-change:transform;opacity:0;transition:opacity .3s}
  body.wand-on #wand{opacity:1}
  #wand svg{display:block;filter:drop-shadow(4px 8px 6px rgba(0,0,0,.45));transform-origin:6px 6px;transition:transform .18s ease}
  #wand.small svg{transform:scale(.72)}
  #wand.flick svg{transform:rotate(-16deg)}
  #wand.small.flick svg{transform:scale(.72) rotate(-16deg)}
  #wand .glow{position:absolute;left:6px;top:6px;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:radial-gradient(circle,rgba(255,244,214,.95) 0,rgba(255,206,120,.45) 28%,rgba(255,170,80,0) 70%);opacity:.55;transition:opacity .3s, transform .3s;animation:breathe 2.4s ease-in-out infinite}
  #wand.hot .glow{opacity:1;transform:scale(1.7)}
  @keyframes breathe{50%{filter:brightness(1.25)}}

  .loader{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);transition:opacity .9s}
  .loader b{font-family:var(--serif);font-weight:500;font-size:24px;color:var(--gold2)}
  .loader span{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}
  .loader.done{opacity:0;pointer-events:none}

  @media (max-width:860px){
    header{padding:14px 16px}
    .bar{left:10px;right:10px;bottom:10px}
    .bar-main{height:auto;flex-wrap:wrap;gap:8px 12px;padding:12px 12px 12px 16px}
    .b-info{flex-basis:100%;flex-wrap:wrap;white-space:normal;gap:2px 10px}
    .b-mvp{flex-basis:100%;font-size:13px}
    .b-dots{flex:1;flex-wrap:wrap}
    .meter{min-width:96px}
    .drawer-in{grid-template-columns:1fr;gap:0}
  }
  @media (prefers-reduced-motion: reduce){ .intro,.bar,.thanks,.thanks .in{transition:none} #wand .glow{animation:none} }
</style>
</head>

const CFG = window.PORTFOLIO;
const OWNER = CFG.owner;
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE = window.matchMedia('(pointer: fine)').matches;

/* ───────────── 종이 목록 · 단계 ─────────────
   s = 0 닫힌 수첩 (지팡이로 열기)
   s = 1 … NS  종이 한 장씩 (도착 → 잉크로 채워짐 → 다음 단계에서 넘어감)
   s = END    수첩이 덮이고 끈으로 묶임 → 감사 인사                        */
const SHEETS = [];
CFG.projects.forEach((proj, pi) => (proj.sheets && proj.sheets.length ? proj.sheets : [{}]).forEach((sheet, si, arr) => {
  SHEETS.push({ proj, pi, sheet, si, count: arr.length, gi: SHEETS.length });
}));
const NS = SHEETS.length;
const FIRST = 1, LAST = NS, END = NS + 1;

/* ───────────── 수첩 치수 (1 unit = 100 mm) ───────────── */
const W = 1.48, D = 2.10, CT = 0.03;
const PT = Math.min(0.006, 0.09 / NS);
const ringX = -W / 2 + 0.075;
const RING_R = 0.085, RING_Y = 0.075;
const RING_Z = [-0.85, -0.51, -0.17, 0.17, 0.51, 0.85];
const pL = ringX - 0.05, pR = W / 2, pW = pR - pL;
const cL = ringX - 0.11, cR = W / 2 + 0.035, cW = cR - cL, cD = D + 0.05;
const COVER_TOP = CT + NS * PT + CT;
const PAGE_H = 1478, PAGE_WPX = 1024;
const fW = cR - (ringX + 0.025);
const BOOK_CX = (cL + cR) / 2, SHEET_CX = (pL + pR) / 2;

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const clamp01 = t => Math.min(1, Math.max(0, t));
const ease = t => { t = clamp01(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeOut = t => 1 - Math.pow(1 - clamp01(t), 3);
const win = (s, a, b) => ease((s - a) / (b - a));
function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

/* ───────────── 렌더러 · 장면 ───────────── */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();

/* ───────────── 캔버스 도우미 ───────────── */
function tex(c, color = true) { const t = new THREE.CanvasTexture(c); if (color) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso; return t; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function spaced(g, text, x, y, sp) { let cx = x; for (const ch of String(text)) { g.fillText(ch, cx, y); cx += g.measureText(ch).width + sp; } return cx; }
function wrap(g, text, x, y, maxW, lh) {
  let line = '';
  for (const w of String(text).split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { g.fillText(line, x, y); y += lh; line = w; } else line = t;
  }
  if (line) { g.fillText(line, x, y); y += lh; }
  return y;
}
const INITIAL = '"Cormorant Garamond", Georgia, serif';
const SANS = '"Noto Sans KR", sans-serif', SERIF = '"Noto Serif KR", serif', PEN = '"Nanum Pen Script", cursive', MONO = '"IBM Plex Mono", monospace', SCRIPT = '"Pinyon Script", cursive';
const INK = '#2A2118', SEPIA = '#5a3a1e';

/* ── 양피지 종이 (모든 장이 공유, 잉크는 장마다 따로) ── */
function drawPaper() {
  const [c, g] = mk(PAGE_WPX, PAGE_H), w = PAGE_WPX, h = PAGE_H, r = rng(7);
  g.fillStyle = '#EAD9B4'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 9000; i++) { g.fillStyle = `rgba(120,88,48,${0.02 + r() * 0.05})`; g.fillRect(r() * w, r() * h, 1 + r() * 2, 1); }
  for (let i = 0; i < 14; i++) {
    const x = r() * w, y = r() * h, rad = 30 + r() * 110;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, 'rgba(150,100,45,0.09)'); gr.addColorStop(1, 'rgba(150,100,45,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for (let i = 0; i < 60; i++) { g.strokeStyle = `rgba(120,85,45,${0.03 + r() * 0.04})`; g.lineWidth = 1; g.beginPath(); const x = r() * w, y = r() * h; g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 140, y + (r() - 0.5) * 30); g.stroke(); }
  const edge = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.4, w / 2, h / 2, Math.max(w, h) * 0.74);
  edge.addColorStop(0, 'rgba(110,70,30,0)'); edge.addColorStop(1, 'rgba(105,62,25,0.34)');
  g.fillStyle = edge; g.fillRect(0, 0, w, h);
  const holeX = ((ringX + 0.078) - pL) / pW * w;
  for (const z of RING_Z) {
    const hy = (z + D / 2) / D * h;
    g.fillStyle = '#cdb98f'; g.beginPath(); g.arc(holeX, hy, 17, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#2a2018'; g.beginPath(); g.arc(holeX, hy, 13, 0, Math.PI * 2); g.fill();
  }
  const t = tex(c); t.generateMipmaps = true; return t;
}

function imageBox(g, img, x, y, w, h, text) {
  g.save();
  rr(g, x, y, w, h, 18);
  if (img) {
    g.clip();
    const r = Math.max(w / img.width, h / img.height), iw = img.width * r, ih = img.height * r;
    g.drawImage(img, x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
  } else {
    g.fillStyle = 'rgba(90,60,30,0.05)'; g.fill();
    g.setLineDash([14, 10]); g.strokeStyle = 'rgba(90,60,30,0.38)'; g.lineWidth = 3; g.stroke(); g.setLineDash([]);
    const cx = x + w / 2, cy = y + h / 2 - 20;
    g.strokeStyle = 'rgba(90,60,30,0.34)'; g.lineWidth = 5; g.lineJoin = 'round';
    g.strokeRect(cx - 60, cy - 42, 120, 84);
    g.beginPath(); g.moveTo(cx - 52, cy + 34); g.lineTo(cx - 12, cy - 4); g.lineTo(cx + 12, cy + 16); g.lineTo(cx + 30, cy); g.lineTo(cx + 52, cy + 34); g.stroke();
    g.beginPath(); g.arc(cx + 28, cy - 20, 9, 0, Math.PI * 2); g.stroke();
    g.fillStyle = 'rgba(90,60,30,0.6)'; g.font = `500 28px ${SANS}`; g.textAlign = 'center';
    g.fillText(text, cx, cy + 92); g.textAlign = 'left';
  }
  g.restore();
}

const IMAGES = new Map();
function loadImages() {
  const srcs = [...new Set(SHEETS.map(s => s.sheet.image).filter(Boolean))];
  return Promise.all(srcs.map(src => new Promise(res => {
    const im = new Image(); im.onload = () => { IMAGES.set(src, im); res(); }; im.onerror = () => res(); im.src = src; setTimeout(res, 6000);
  })));
}

/* ── 장마다의 잉크 (투명 바탕 위에 내용만) ── */

  const img = sheet.image ? IMAGES.get(sheet.image) : null;

  g.fillStyle = '#7d6a50'; g.textAlign = 'right'; g.fillText(`P. ${pad(gi + 1)} / ${pad(NS)}`, R, 150); g.textAlign = 'left';
  let y;

    g.font = `600 28px ${MONO}`; g.fillStyle = col; spaced(g, OWNER.nameEn, L + 4, 362, 6);

    imageBox(g, img, L, y + 30, CW, 520, '[사진 또는 일러스트]');
    y = y + 610;
    (OWNER.contact || []).forEach(([k, v]) => {
      g.fillStyle = col; g.font = `600 22px ${MONO}`; spaced(g, k.toUpperCase(), L, y, 3);
      g.fillStyle = INK; g.font = `500 28px ${SANS}`; g.fillText(v, L + 180, y); y += 48;

  } else if (proj.toolbox) {
    g.fillStyle = INK; g.font = `900 84px ${SERIF}`; y = wrap(g, proj.title, L, 270, CW, 96);
    g.font = `500 32px ${SANS}`; g.fillStyle = '#5b4a36'; y = wrap(g, proj.mvp || '', L, y + 6, CW, 46) + 30;
    (proj.groups || []).forEach(([name, items]) => {

      y += 50;

        g.fillStyle = INK; g.fillText(t, x + 20, y + 35); x += tw + 12;
      });
      y += 100;
    });
  } else if (si === 0) {
    const big = proj.title.length > 10;

    y = wrap(g, proj.title, L, 280, CW, big ? 86 : 104);
    y += 24;
    rr(g, L, y, 104, 44, 10); g.fillStyle = col; g.fill();
    g.fillStyle = '#F5EAD2'; g.font = `600 24px ${MONO}`; spaced(g, 'MVP', L + 22, y + 31, 4);
    g.fillStyle = INK; g.font = `700 40px ${SANS}`; y = wrap(g, proj.mvp || '[MVP 한 줄]', L, y + 100, CW, 56);
    let x = L; y += 6;
    g.font = `700 26px ${SANS}`;
    (proj.tags || []).forEach(t => {
      const tw = g.measureText(t).width + 36;
      rr(g, x, y, tw, 46, 23); g.fillStyle = col; g.globalAlpha = 0.16; g.fill(); g.globalAlpha = 1;

    g.fillStyle = INK; g.font = `900 66px ${SERIF}`;
    y = wrap(g, `${pad(si + 1)}  ${sheet.label || ''}`, L, 320, CW, 78) + 10;
    imageBox(g, img, L, y, CW, 640, '[화면 이미지 자리]');
    y += 700;
    g.font = `500 32px ${SANS}`;
    if (sheet.text) { g.fillStyle = INK; wrap(g, sheet.text, L, y, CW, 48); }
    else { g.fillStyle = 'rgba(90,60,30,0.55)'; g.fillText('[설명을 적어 주세요]', L, y); }
  }
  g.save(); g.translate(L + 6, PAGE_H - 92); g.rotate(-0.035);
  g.font = `400 46px ${PEN}`; g.fillStyle = SEPIA;
  g.fillText(count > 1 ? `${proj.title} · ${si + 1}/${count}` : proj.title, 0, 0);
  g.restore();
  g.font = `500 22px ${MONO}`; g.fillStyle = '#93805f'; g.textAlign = 'right';
  g.fillText(`${OWNER.nameEn} · PORTFOLIO`, R, PAGE_H - 52); g.textAlign = 'left';
  return tex(c);
}

function drawPageBack() {
  const [c, g] = mk(512, 740), r = rng(3);
  g.fillStyle = '#E4D3AE'; g.fillRect(0, 0, 512, 740);
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(120,90,50,${r() * 0.06})`; g.fillRect(r() * 512, r() * 740, 2, 1); }
  g.strokeStyle = 'rgba(110,80,45,0.16)'; g.lineWidth = 2;
  for (let y = 80; y < 720; y += 30) { g.beginPath(); g.moveTo(60, y); g.lineTo(470, y); g.stroke(); }
  const e = g.createRadialGradient(256, 370, 200, 256, 370, 470); e.addColorStop(0, 'rgba(100,60,25,0)'); e.addColorStop(1, 'rgba(100,60,25,0.28)');
  g.fillStyle = e; g.fillRect(0, 0, 512, 740);
  return tex(c);
}

/* ── 버건디 가죽: 오돌토돌한 결 + 테두리 바느질 + 바느질 이니셜 (색 · 높이 맵) ── */
function drawLeather(front) {
  const w = 1024, h = Math.round(1024 * cD / (front ? fW : cW));
  const [c, g] = mk(w, h), [hc, hg] = mk(w, h), r = rng(front ? 11 : 23);
  // 바탕색과 얼룩
  const base = g.createLinearGradient(0, 0, w, h);
  base.addColorStop(0, '#521520'); base.addColorStop(0.55, '#40101a'); base.addColorStop(1, '#2c0a11');
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  hg.fillStyle = '#7a7a7a'; hg.fillRect(0, 0, w, h);
  for (let i = 0; i < 22; i++) {
    const x = r() * w, y = r() * h, rad = 80 + r() * 260, light = r() < 0.5;
    const gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, light ? 'rgba(120,40,50,0.16)' : 'rgba(15,2,5,0.26)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  // 페블 그레인: 작은 알갱이를 촘촘히
  for (let i = 0; i < 42000; i++) {
    const x = r() * w, y = r() * h, rad = 1.6 + r() * 3.2;
    const v = r();
    g.fillStyle = v < 0.5 ? `rgba(14,1,4,${0.12 + r() * 0.12})` : `rgba(125,45,55,${0.05 + r() * 0.07})`;
    g.beginPath(); g.ellipse(x, y, rad, rad * (0.7 + r() * 0.5), r() * 3, 0, Math.PI * 2); g.fill();
    hg.fillStyle = v < 0.5 ? `rgba(40,40,40,${0.25 + r() * 0.2})` : `rgba(230,230,230,${0.22 + r() * 0.2})`;
    hg.beginPath(); hg.ellipse(x, y, rad, rad * (0.7 + r() * 0.5), r() * 3, 0, Math.PI * 2); hg.fill();
  }
  // 잔주름
  for (let i = 0; i < 260; i++) {
    const x = r() * w, y = r() * h, len = 20 + r() * 70, a = r() * Math.PI;
    hg.strokeStyle = `rgba(30,30,30,${0.2 + r() * 0.25})`; hg.lineWidth = 1 + r() * 1.5;
    g.strokeStyle = `rgba(15,2,5,${0.12 + r() * 0.12})`; g.lineWidth = 1;
    for (const ctx of [g, hg]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + Math.cos(a + 0.6) * len * 0.5, y + Math.sin(a + 0.6) * len * 0.5, x + Math.cos(a) * len, y + Math.sin(a) * len); ctx.stroke(); }
  }
  // 손때 묻은 가장자리
  const ed = 70;
  for (const [x0, y0, x1, y1] of [[0, 0, ed, 0], [w, 0, w - ed, 0], [0, 0, 0, ed], [0, h, 0, h - ed]]) {
    const gr = g.createLinearGradient(x0, y0, x1, y1); gr.addColorStop(0, 'rgba(20,3,6,0.55)'); gr.addColorStop(1, 'rgba(20,3,6,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }
  // 바느질 홈 + 실
  function stitchLine(points, len, gap, width) {
    const total = []; let acc = 0;
    for (let i = 0; i < points.length - 1; i++) { const [ax, ay] = points[i], [bx, by] = points[i + 1]; const d = Math.hypot(bx - ax, by - ay); total.push([ax, ay, bx, by, d, acc]); acc += d; }
    // 홈 (눌린 자국)
    hg.strokeStyle = 'rgba(25,25,25,0.85)'; hg.lineWidth = width + 5; hg.lineJoin = 'round';
    g.strokeStyle = 'rgba(20,3,6,0.45)'; g.lineWidth = width + 4;
    for (const ctx of [g, hg]) { ctx.beginPath(); points.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }
    for (let d = 0; d < acc; d += len + gap) {
      const seg = total.find(t => d >= t[5] && d <= t[5] + t[4]); if (!seg) continue;
      const [ax, ay, bx, by, sd, s0] = seg, u = (d - s0) / sd, x = ax + (bx - ax) * u, y = ay + (by - ay) * u;
      const ang = Math.atan2(by - ay, bx - ax), dx = Math.cos(ang) * len, dy = Math.sin(ang) * len;
      // 실 (밝은 크림 금빛)
      g.lineCap = 'round'; g.lineWidth = width;
      g.strokeStyle = 'rgba(0,0,0,0.45)'; g.beginPath(); g.moveTo(x + 1.5, y + 2); g.lineTo(x + dx + 1.5, y + dy + 2); g.stroke();
      g.strokeStyle = '#d9b98a'; g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.stroke();
      g.strokeStyle = 'rgba(255,240,210,0.55)'; g.lineWidth = width * 0.35; g.beginPath(); g.moveTo(x + 0.6, y - 0.8); g.lineTo(x + dx * 0.8, y + dy * 0.8 - 0.8); g.stroke();
      // 바늘 구멍
      g.fillStyle = 'rgba(10,1,3,0.8)'; g.beginPath(); g.arc(x - Math.cos(ang) * gap * 0.5, y - Math.sin(ang) * gap * 0.5, width * 0.32, 0, Math.PI * 2); g.fill();
      hg.lineCap = 'round'; hg.strokeStyle = '#f2f2f2'; hg.lineWidth = width; hg.beginPath(); hg.moveTo(x, y); hg.lineTo(x + dx, y + dy); hg.stroke();
    }
  }
  const m = 46;
  stitchLine([[m, m], [w - m, m], [w - m, h - m], [m, h - m], [m, m]], 15, 9, 5.5);
  if (front) {
    // 바느질 이니셜: 글자 모양을 따라 눌린 자국 + 촘촘한 땀
    const [jc, jg] = mk(w, h);
    jg.font = `italic 600 470px ${INITIAL}`; jg.textAlign = 'center'; jg.textBaseline = 'alphabetic';
    const jx = w * 0.5, jy = h * 0.86, ch = OWNER.initial || 'J';
    // 눌린(디보싱) 바탕
    hg.save(); hg.shadowColor = 'rgba(0,0,0,0.9)'; hg.shadowBlur = 14; hg.font = jg.font; hg.textAlign = 'center';
    hg.fillStyle = 'rgba(45,45,45,0.9)'; hg.fillText(ch, jx, jy); hg.restore();
    g.save(); g.font = jg.font; g.textAlign = 'center'; g.fillStyle = 'rgba(25,3,7,0.32)'; g.fillText(ch, jx, jy); g.restore();
    // 땀 (점선 외곽선을 두 겹으로 그려 입체감)

  if (kind === 'spell' || kind === 'chime') {
    // 맑은 종소리 (살짝 어긋난 음정으로 반짝임)
    const notes = kind === 'spell' ? [880, 1174.7, 1568, 2093, 2637] : [659.3, 987.8, 1318.5, 1975.5];
    notes.forEach((f, i) => {
      [0, 4].forEach(det => {
        const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = f; o.detune.value = det;
        const st = t + i * (kind === 'spell' ? 0.075 : 0.14);
        env(g, st, 0.015, (kind === 'spell' ? 0.07 : 0.08) / (1 + i * 0.25), 1.6);
        o.connect(g).connect(master); o.start(st); o.stop(st + 1.7);
      });
    });
  }
}

/* ───────────── 상태 · 스크롤 ───────────── */
let opened = false, opening = false, openT = 0;
let sTarget = 0, sNow = 0;
const html = document.documentElement;
const spacer = document.getElementById('spacer');
spacer.innerHTML = Array.from({ length: END }, (_, i) => `<section aria-label="단계 ${i + 1}"></section>`).join('');
html.classList.add('locked');
function readScroll() { if (opened) sTarget = Math.min(END, Math.max(1, 1 + window.scrollY / window.innerHeight)); }
window.addEventListener('scroll', readScroll, { passive: true });
function goStep(k) { if (!opened) return; window.scrollTo({ top: (Math.min(END, Math.max(1, k)) - 1) * window.innerHeight, behavior: REDUCED ? 'auto' : 'smooth' }); }

/* ───────────── UI: 하단 바 · 서랍 · 감사 인사 ───────────── */
const $ = id => document.getElementById(id);
const barEl = $('bar'), drawer = $('drawerIn'), moreBtn = $('moreBtn'), openBtn = $('openBtn');
$('brandName').textContent = OWNER.nameEn;
$('introName').textContent = OWNER.name;
$('thanksName').textContent = `${OWNER.name}, 완성.`;
$('thanksMsg').textContent = OWNER.thanks || '';
$('thanksContact').innerHTML = (OWNER.contact || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');
function barHeight() { return barEl.getBoundingClientRect().height || 64; }

(function buildDots() {
  let h = '';
  SHEETS.forEach((S, j) => {
    if (j > 0 && S.si === 0) h += '<span class="gap"></span>';
    h += `<button data-k="${FIRST + j}" aria-label="${esc(S.proj.title)} ${S.si + 1}쪽" title="${esc(S.proj.title)}${S.count > 1 ? ' · ' + esc(S.sheet.label || S.si + 1) : ''}"></button>`;
  });
  $('bDots').innerHTML = h;
  $('bDots').addEventListener('click', e => { const b = e.target.closest('button[data-k]'); if (b) goStep(Number(b.dataset.k)); });
})();
moreBtn.addEventListener('click', () => {
  const on = !barEl.classList.contains('open');
  barEl.classList.toggle('open', on); moreBtn.setAttribute('aria-expanded', String(on)); moreBtn.textContent = on ? '닫기 ▾' : '자세히 ▴';
});
openBtn.addEventListener('click', () => castOpen(null));
$('againBtn').addEventListener('click', restart);

let lastBarKey = '';
function updateBar(s) {
  const k = Math.min(LAST, Math.max(FIRST, Math.round(s)));
  const key = !opened ? 'intro' : endSeqT > 0.5 ? 'end' : 'p' + k;
  // 완성도 (채워진 페이지)
  const filled = pages.reduce((a, p) => a + p.reveal, 0);
  const pct = Math.round(filled / NS * 100);
  $('meterTxt').innerHTML = `${esc(OWNER.name)} 완성 <b>${pct}%</b>`;
  $('meterFill').style.width = pct + '%';
  document.querySelectorAll('#bDots button').forEach((b, j) => { b.classList.toggle('filled', pages[j].reveal > 0.98); b.classList.toggle('cur', opened && endSeqT < 0.5 && j === k - FIRST); });
  if (key === lastBarKey) return;
  lastBarKey = key;
  openBtn.hidden = opened;
  moreBtn.hidden = !opened || key === 'end';
  if (key === 'intro') {
    $('bKind').textContent = 'Portfolio Notebook';
    $('bTitle').textContent = `${OWNER.name}의 수첩`;
    $('bMvp').innerHTML = `<span class="hint">${FINE ? '지팡이로 수첩을 톡 두드려 마법을 걸어 보세요' : '수첩을 톡 눌러 마법을 걸어 보세요'}</span>`;
    drawer.innerHTML = '';
    return;
  }
  if (key === 'end') {
    $('bKind').textContent = 'The Last Page';
    $('bTitle').textContent = `${OWNER.name}, 완성`;
    $('bMvp').textContent = '모든 페이지가 채워졌어요';
    barEl.classList.remove('open'); moreBtn.textContent = '자세히 ▴';
    return;
  }
  const S = SHEETS[k - FIRST], P = S.proj;
  $('bKind').textContent = `${P.kind}${S.count > 1 ? ` · ${S.si + 1}/${S.count}` : ''}`;
  $('bTitle').textContent = P.title;
  $('bMvp').textContent = P.about ? (OWNER.intro || P.mvp) : (P.mvp || '');
  let left = `<div><div class="lab">${esc(P.kind)}</div><h3>${esc(P.title)}${S.si > 0 && S.sheet.label ? ' · ' + esc(S.sheet.label) : ''}</h3>`;
  if (P.about) left += `<p>${esc(OWNER.role)}</p><p>${esc(OWNER.intro)}</p>`;
  else left += `<div class="lab">MVP</div><p>${esc(P.mvp || '')}</p>`;
  if (S.sheet.text) left += `<div class="lab">이 페이지</div><p>${esc(S.sheet.text)}</p>`;
  left += '</div>';
  let right = '<div>';
  if (P.tags && P.tags.length) right += `<div class="lab">Tags</div><div class="tags">${P.tags.map(t => `<span>${esc(t)}</span>`).join('')}</div>`;
  if (P.groups) right += P.groups.map(([n, items]) => `<div class="lab">${esc(n)}</div><div class="tags">${items.map(t => `<span>${esc(t)}</span>`).join('')}</div>`).join('');
  if (P.about) right += `<div class="lab">Contact</div><dl>${(OWNER.contact || []).map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`;
  right += `<div class="lab">Page</div><p>${pad(S.gi + 1)} / ${pad(NS)} · 스크롤하면 다음 장으로 넘어가요</p></div>`;
  drawer.innerHTML = left + right;
}

/* ───────────── 지팡이 커서 · 2D 마법 효과 ───────────── */
const wandEl = $('wand'), fx = $('fx'), fg = fx.getContext('2d');
let mx = window.innerWidth * 0.62, my = window.innerHeight * 0.58, lmx = mx, lmy = my, wandAngle = 0;
const motes = [];
let spellFx = null;
function sizeFx() { const dpr = Math.min(2, window.devicePixelRatio || 1); fx.width = window.innerWidth * dpr; fx.height = window.innerHeight * dpr; fg.setTransform(dpr, 0, 0, dpr, 0, 0); }
if (FINE) document.body.classList.add('wand-on');
window.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') return;
  mx = e.clientX; my = e.clientY;
  if (!document.body.classList.contains('wand-on') && FINE) document.body.classList.add('wand-on');
});
function hitBook(x, y) {
  ray.setFromCamera(tv1.set((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1, 0), camera);
  return ray.intersectObjects(clickables, false)[0] || null;
}
const ray = new THREE.Raycaster();
function updateCursor(dt, t) {
  if (!FINE) return;
  const dx = mx - lmx, dy = my - lmy, sp = Math.hypot(dx, dy);
  lmx += dx * Math.min(1, dt * 22); lmy += dy * Math.min(1, dt * 22);
  wandAngle += ((Math.max(-0.35, Math.min(0.35, dx * 0.012))) - wandAngle) * Math.min(1, dt * 8);
  wandEl.style.transform = `translate3d(${lmx - 6}px, ${lmy - 6}px, 0) rotate(${wandAngle}rad)`;
  // 지팡이 끝에서 은은한 금빛 티끌
  const emit = REDUCED ? 0 : Math.min(3, sp * 0.06) + (wandEl.classList.contains('hot') ? 0.35 : 0.08);
  let n = Math.floor(emit + Math.random());
  while (n-- > 0 && motes.length < 140) motes.push({ x: lmx + (Math.random() - 0.5) * 4, y: lmy + (Math.random() - 0.5) * 4, vx: (Math.random() - 0.5) * 18 - dx * 0.4, vy: (Math.random() - 0.5) * 14 - dy * 0.4, life: 0, max: 0.6 + Math.random() * 0.7, r: 0.7 + Math.random() * 1.5 });
}
function drawFx(dt) {
  fg.clearRect(0, 0, window.innerWidth, window.innerHeight);
  fg.globalCompositeOperation = 'lighter';
  for (let i = motes.length - 1; i >= 0; i--) {
    const m = motes[i]; m.life += dt;
    if (m.life > m.max) { motes.splice(i, 1); continue; }
    m.vy += 26 * dt; m.vx *= 0.96; m.vy *= 0.96; m.x += m.vx * dt; m.y += m.vy * dt;
    const a = Math.sin(Math.PI * (m.life / m.max)) * 0.75;
    const gr = fg.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 4);
    gr.addColorStop(0, `rgba(255,236,190,${a})`); gr.addColorStop(1, 'rgba(255,190,110,0)');
    fg.fillStyle = gr; fg.beginPath(); fg.arc(m.x, m.y, m.r * 4, 0, Math.PI * 2); fg.fill();
  }
  if (spellFx) {
    // 지팡이 끝에서 수첩까지 흐르는 빛의 실
    spellFx.t += dt;
    const { x0, y0, x1, y1 } = spellFx, cx = (x0 + x1) / 2 + (y1 - y0) * 0.25, cy = Math.min(y0, y1) - 90;
    const head = clamp01(spellFx.t / 0.55), tail = clamp01((spellFx.t - 0.25) / 0.6);
    const pt = u => [(1 - u) * (1 - u) * x0 + 2 * (1 - u) * u * cx + u * u * x1, (1 - u) * (1 - u) * y0 + 2 * (1 - u) * u * cy + u * u * y1];
    fg.lineCap = 'round';
    for (let u = tail; u < head; u += 0.012) {
      const [x, y] = pt(u), [x2, y2] = pt(Math.min(head, u + 0.014));
      const a = (u - tail) / Math.max(0.001, head - tail);
      fg.strokeStyle = `rgba(255,226,160,${0.55 * a})`; fg.lineWidth = 1.2 + a * 2.6; fg.shadowColor = 'rgba(255,200,120,0.9)'; fg.shadowBlur = 14;
      fg.beginPath(); fg.moveTo(x, y); fg.lineTo(x2, y2); fg.stroke();
      if (Math.random() < 0.08 && motes.length < 220) motes.push({ x, y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, life: 0, max: 0.5 + Math.random() * 0.5, r: 0.8 + Math.random() * 1.2 });
    }
    fg.shadowBlur = 0;
    if (spellFx.t > 0.9) spellFx = null;
  }
  fg.globalCompositeOperation = 'source-over';
}

/* ───────────── 지팡이로 열기 ───────────── */
function castOpen(e) {
  if (opened || opening) return;
  ensureAudio();
  opening = true;
  const target = new THREE.Vector3(BOOK_CX, COVER_TOP, 0.2).project(camera);
  const tx = (target.x * 0.5 + 0.5) * window.innerWidth, ty = (-target.y * 0.5 + 0.5) * window.innerHeight;
  const x0 = e ? e.clientX : tx + 120, y0 = e ? e.clientY : ty - 140;
  spellFx = { x0, y0, x1: tx, y1: ty, t: 0 };
  wandEl.classList.add('flick'); setTimeout(() => wandEl.classList.remove('flick'), 260);
  play('spell');
  burst.t = 0;
  $('intro').classList.add('gone');
  setTimeout(() => { openStart = clock.elapsedTime; }, REDUCED ? 0 : 420);
}
let openStart = -1;
const OPEN_DUR = REDUCED ? 1.2 : 3.6;
function finishOpen() {
  opening = false; opened = true;
  html.classList.remove('locked');
  window.scrollTo(0, 0);
  sTarget = 1;
  wandEl.classList.add('small');
}
function restart() {
  $('thanks').classList.remove('show'); $('thanks').setAttribute('aria-hidden', 'true');
  opened = false; opening = false; openStart = -1; openT = 0;
  html.style.scrollSnapType = 'none'; window.scrollTo(0, 0); html.style.scrollSnapType = '';
  html.classList.add('locked');
  sTarget = sNow = sPrev = 0; endSeqT = 0; thanked = false;
  pages.forEach(p => { p.reveal = 0; p.uReveal.value = 0; p.prevFlip = 0; p.prevArr = 0; });
  $('intro').classList.remove('gone');
  wandEl.classList.remove('small');
  lastBarKey = '';
}

canvas.addEventListener('click', e => {
  if (!opened) { if (hitBook(e.clientX, e.clientY)) castOpen(e); else { wandEl.classList.add('flick'); setTimeout(() => wandEl.classList.remove('flick'), 220); } return; }
  // 펼친 뒤: 종이를 톡 누르면 다음 장
  if (endSeqT < 0.1 && hitBook(e.clientX, e.clientY)) { wandEl.classList.add('flick'); setTimeout(() => wandEl.classList.remove('flick'), 220); goStep(Math.round(sNow) + 1); }
});
window.addEventListener('keydown', e => {
  if (!opened && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); castOpen(null); return; }
  if (!opened) return;
  if (['ArrowDown', 'ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); goStep(Math.round(sNow) + 1); }
  if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); goStep(Math.round(sNow) - 1); }
});
window.addEventListener('pointerdown', ensureAudio, { once: true });

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  sizeFx();
  readScroll();
}
window.addEventListener('resize', resize);

/* ───────────── 루프 ───────────── */
const clock = new THREE.Clock();
const P = new THREE.Vector3(), Q = new THREE.Quaternion(), camGoal = new THREE.Vector3(), lookGoal = new THREE.Vector3();
const camPos = new THREE.Vector3(...CAM.hero.p), camLook = new THREE.Vector3(...CAM.hero.l);
camera.position.copy(camPos); camera.lookAt(camLook);
let sPrev = 0, viewShift = 0, prevCover = 0, prevBand = 0, thanked = false;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;

  /* 진행도 */
  if (opening && openStart >= 0) {
    openT = clamp01((t - openStart) / OPEN_DUR);
    sTarget = openT; sNow = openT;
    if (openT >= 1) finishOpen();
  } else {
    sNow += (sTarget - sNow) * Math.min(1, dt * 3.2);
  }
  const endGoal = opened && sNow > END - 0.45 ? 1 : 0;
  endSeqT += (endGoal ? dt / (REDUCED ? 1.5 : 5.2) : -dt / 1.1);
  endSeqT = clamp01(endSeqT);

  for (const p of parts) { p.pose(sNow, P, Q); p.pivot.position.copy(P); p.pivot.quaternion.copy(Q); }

  /* 종이: 도착하면 잉크가 채워짐 · 넘김 소리 */
  for (const p of pages) {
    const arr = p.arriveAt(sNow);
    if (arr > 0.97 && p.reveal < 1) p.reveal = Math.min(1, p.reveal + dt / (REDUCED ? 0.6 : 2.0));
    p.uReveal.value = ease(p.reveal);
    const f = p.flipAt(sNow);
    if ((p.prevFlip < 0.5) !== (f < 0.5)) play('page');
    if (p.prevArr < 0.9 && arr >= 0.9) play('settle');
    p.prevFlip = f; p.prevArr = arr;
  }
  const cf = cover.flipAt(sNow);
  if ((prevCover < 0.5) !== (cf < 0.5)) play('cover');
  prevCover = cf;
  const bk = updateBand(sNow, t);
  if (prevBand < 0.05 && bk >= 0.05) play('stretch');
  if (prevBand > 0.03 && bk <= 0.03) play('snap');
  prevBand = bk;

  /* 마지막: 감사 인사 */
  if (endSeqT > 0.93 && !thanked) { thanked = true; $('thanks').classList.add('show'); $('thanks').setAttribute('aria-hidden', 'false'); play('chime'); }
  if (endSeqT < 0.6 && thanked) { thanked = false; $('thanks').classList.remove('show'); $('thanks').setAttribute('aria-hidden', 'true'); }
  barEl.classList.toggle('dim', endSeqT > 0.9);

  /* 촛불 · 떠 있는 초 · 가루 */
  candles.forEach(c => {
    const f = 0.82 + 0.12 * Math.sin(t * 9.3 + c.seed) + 0.07 * Math.sin(t * 23.1 + c.seed * 2) + 0.05 * Math.sin(t * 3.7 + c.seed);
    c.lt.intensity = c.base * f; c.flame.scale.set(0.085 * (0.92 + 0.08 * f), 0.17 * f, 1);
    c.flame.material.rotation = Math.sin(t * 2.1 + c.seed) * 0.06; c.halo.material.opacity = 0.16 + 0.08 * f;
  });
  floaters.forEach(fl => {
    fl.g.position.y = fl.base.y + Math.sin(t * 0.6 + fl.seed) * 0.08;
    fl.g.position.x = fl.base.x + Math.sin(t * 0.25 + fl.seed) * 0.05;
    fl.flame.scale.y = 0.12 * (0.88 + 0.12 * Math.sin(t * 8 + fl.seed * 3));
  });
  updateDust(t, dt);
  updateBurst(dt);

  /* 수첩 위에서 지팡이가 반짝임 */
  let hot = false;
  if (FINE && !opened && !opening) hot = !!hitBook(mx, my);
  wandEl.classList.toggle('hot', hot);
  const glowGoal = hot ? 2.2 : 0, spellGlow = burst.t >= 0 ? Math.sin(Math.PI * clamp01(burst.t / 2.6)) * 4.5 : 0;
  bookGlow.intensity += (Math.max(glowGoal, spellGlow) - bookGlow.intensity) * Math.min(1, dt * 6);

  /* 카메라 (읽을 때는 종이를 화면 가득) */
  const zoom = camTarget(sNow, camGoal, lookGoal);
  const k = Math.min(1, dt * 3.6);
  camPos.lerp(camGoal, k); camLook.lerp(lookGoal, k);
  camera.position.copy(camPos); camera.lookAt(camLook);
  const w = window.innerWidth, h = window.innerHeight;
  const shiftGoal = zoom * (barHeight() + 18) * 0.5;
  viewShift += (shiftGoal - viewShift) * Math.min(1, dt * 5);
  if (viewShift > 0.5) camera.setViewOffset(w, h, 0, viewShift, w, h); else camera.clearViewOffset();

  updateBar(sNow);
  updateCursor(dt, t);
  drawFx(dt);
  renderer.render(scene, camera);
  sPrev = sNow;
  requestAnimationFrame(frame);
}

/* ───────────── 시작 ───────────── */
async function loadFonts() {
  const words = [JSON.stringify(CFG), 'PORTFOLIO MVP P. / 0123456789 · [대표 이미지] [화면 이미지 자리] [설명을 적어 주세요] [사진 또는 일러스트]'].join(' ');
  const specs = [`500 32px ${SANS}`, `700 32px ${SANS}`, `900 32px ${SERIF}`, `400 40px ${PEN}`, `400 80px ${SCRIPT}`, `500 24px ${MONO}`, `600 24px ${MONO}`, `italic 600 80px ${INITIAL}`];
  await new Promise(r => { const l = document.querySelector('link[rel=stylesheet]'); if (!l || l.sheet) r(); else { l.addEventListener('load', r); l.addEventListener('error', r); setTimeout(r, 3000); } });
  await Promise.race([Promise.all(specs.map(s => document.fonts.load(s, words).catch(() => null))), new Promise(r => setTimeout(r, 4500))]);
}

(async () => {
  await Promise.all([loadFonts(), loadImages()]);
  build();
  resize();
  if (FINE) { lmx = mx; lmy = my; }
  frame();
  document.getElementById('loader').classList.add('done');
})();
</script>
