<!--
  ╔════════════════════════════════════════════════════════════════════════╗
  ║  ✏️  여기만 고치면 됩니다 — 포트폴리오 내용 설정                             ║
  ║                                                                        ║
  ║  · projects 배열의 순서 = 수첩에 담기는 순서 (= 책갈피 순서)                  ║
  ║  · sheets 한 장 = 펼친 수첩 한 면(왼쪽 글 + 오른쪽 이미지)                     ║
  ║    - 첫 번째 장은 자동으로 "프로젝트 표지"(제목 · MVP · 목차)로 그려져요        ║
  ║    - 두 번째부터는 label(소제목), image(이미지 주소), text(설명)               ║
  ║  · image를 비워 두면 "이미지 자리" 상자가 그려져요.                           ║
  ║    이미지는 images 폴더에 넣고 'images/screen1.png'처럼 적으면 됩니다.         ║
  ║                                                                        ║
  ║  · [선택] detail — 상세 보기(돋보기)에 나오는 9단계 내용                       ║
  ║    detail: { label: 'UX 개선 제안', sections: {                            ║
  ║      overview, problem, research, insight, direction,                    ║
  ║      flow, wireframe, final, result } }                                  ║
  ║    각 단계는 { text: '설명', images: ['images/a.png'] } 형식이에요.          ║
  ║    비워 둔 단계는 "[적어 주세요]" 자리로 보여요.                               ║
  ║                                                                        ║
  ║  · owner.resume = PDF 이력서 경로 (예: 'files/resume.pdf')                 ║
  ╚════════════════════════════════════════════════════════════════════════╝
-->

        ['개발 · 배포', ['HTML/CSS', 'Next.js', 'GitHub', 'Netlify', 'Google Cloud', 'nginx', 'pm2']],
      ],
      sheets: [ { label: '도구' } ] },

</script>

<style>
  :root{
    --bg:#21150F; --deep:#382319; --burgundy:#5B2529; --gold:#B69A64; --parch:#EADCC4; --cream:#F5EBDD; --text:#3D2B20;
    --muted:#A8957A; --line:rgba(182,154,100,.38); --glass:rgba(33,21,15,.72);
    --en:'Cormorant Garamond', 'Noto Serif KR', Georgia, serif; --serif:'Noto Serif KR', Georgia, serif; --sans:'Noto Sans KR', system-ui, sans-serif;
    --script:'Pinyon Script', cursive; --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--cream);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--gold);outline-offset:3px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
  #scene.hover{cursor:pointer}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 52%,rgba(10,5,2,.6) 100%)}

  /* ── 헤더 ── */
  .top{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:28px;padding:26px 48px 0}
  .logo{font-family:var(--en);font-weight:600;font-size:19px;line-height:1.05;letter-spacing:.12em;color:var(--cream);background:none;border:0;padding:0;text-align:left}
  .top .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),rgba(182,154,100,.12))}
  .who{font-family:var(--en);font-size:14px;letter-spacing:.14em;color:var(--parch);white-space:nowrap}
  .tools{display:flex;align-items:center;gap:6px}
  .ic{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;border:0;background:none;color:var(--parch);transition:background .2s,color .2s}
  .ic:hover{background:rgba(182,154,100,.14);color:#fff}
  .ic svg{width:19px;height:19px}
  .contact-btn{font-family:var(--en);font-size:14px;letter-spacing:.16em;border:0;background:none;color:var(--parch);padding:8px 6px}
  .contact-btn:hover{color:#fff}
  .pop{position:fixed;z-index:60;top:76px;right:40px;min-width:280px;background:#2a1a12;border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .pop h4{margin:0 0 10px;font-family:var(--en);letter-spacing:.14em;font-weight:600;color:var(--gold);font-size:14px}
  .pop a,.pop button.row{display:flex;justify-content:space-between;gap:18px;width:100%;padding:10px 0;border:0;border-top:1px solid rgba(182,154,100,.18);background:none;text-decoration:none;font-size:14.5px;color:var(--cream);text-align:left}
  .pop a span,.pop button.row span{color:var(--muted);font-family:var(--en);letter-spacing:.1em}
  .pop a:hover,.pop button.row:hover{color:#fff}

  /* ── 화면 1: 랜딩 ── */
  .landing{position:fixed;inset:0;z-index:10;pointer-events:none;transition:opacity .7s ease}
  .landing.out{opacity:0}
  .copy{position:absolute;right:max(6vw,48px);top:50%;transform:translateY(-52%);width:min(520px,40vw);text-align:center;pointer-events:auto}
  .copy h1{font-family:var(--serif);font-weight:500;font-size:clamp(34px,3.6vw,54px);line-height:1.38;margin:0;color:var(--cream);letter-spacing:-.01em;white-space:pre-line;text-shadow:0 4px 30px rgba(0,0,0,.45)}
  .copy p{font-size:16px;line-height:1.85;color:#CDBDA3;margin:22px 0 34px;white-space:pre-line}
  .open-btn{display:inline-flex;align-items:center;gap:12px;padding:14px 34px;border-radius:999px;border:1px solid var(--gold);background:rgba(33,21,15,.35);color:var(--cream);font-size:16px;letter-spacing:.02em;transition:background .25s,box-shadow .25s}
  .open-btn:hover{background:rgba(182,154,100,.16);box-shadow:0 0 0 4px rgba(182,154,100,.12)}
  .open-btn svg{width:20px;height:20px}
  .toc-link{display:block;margin:30px auto 0;border:0;background:none;color:var(--parch);font-size:14px;letter-spacing:.04em}
  .toc-link::before{content:"";display:block;width:110px;height:1px;margin:0 auto 14px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .toc-link:hover{color:#fff}
  .foot{position:absolute;bottom:30px;left:48px;right:48px;display:flex;justify-content:space-between;align-items:center;font-family:var(--en);font-size:15px;letter-spacing:.06em;color:var(--parch);pointer-events:auto}
  .scroll-hint{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--parch);font-family:var(--en);font-size:15px}
  .mouse{width:16px;height:26px;border:1.5px solid var(--parch);border-radius:9px;position:relative}
  .mouse::after{content:"";position:absolute;left:50%;top:5px;width:2px;height:5px;margin-left:-1px;background:var(--parch);border-radius:2px;animation:wheel 1.8s ease-in-out infinite}
  @keyframes wheel{50%{transform:translateY(5px);opacity:.3}}

  /* ── 화면 2: 펼친 수첩 하단 ── */
  .pager{position:fixed;z-index:20;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;transition:opacity .5s}
  .pager.out{opacity:0;pointer-events:none}
  .pager .nav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:rgba(33,21,15,.5);display:inline-flex;align-items:center;justify-content:center;color:var(--parch)}
  .pager .nav:hover{border-color:var(--gold);color:#fff}
  .pager .nav[disabled]{opacity:.3;pointer-events:none}
  .pager .num{font-family:var(--en);font-size:20px;letter-spacing:.08em;min-width:84px;text-align:center;color:var(--cream)}
  .side-act{position:fixed;z-index:20;bottom:26px;display:flex;gap:10px;transition:opacity .5s}
  .side-act.out{opacity:0;pointer-events:none}
  .side-act.l{left:48px} .side-act.r{right:48px}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(33,21,15,.55);color:var(--parch);font-size:14px;white-space:nowrap}
  .pill:hover{border-color:var(--gold);color:#fff}
  .pill svg{width:16px;height:16px}
  .pill.gold{border-color:var(--gold);color:var(--cream)}
  .where{position:fixed;z-index:20;left:50%;bottom:74px;transform:translateX(-50%);font-family:var(--en);font-size:15px;letter-spacing:.08em;color:var(--muted);white-space:nowrap;transition:opacity .5s}
  .where.out{opacity:0}

  /* ── 공통: 가죽 프레임 + 양피지 ── */
  .overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:88px 40px 32px;background:rgba(18,10,6,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .45s ease}
  .overlay.show{opacity:1;pointer-events:auto}
  .leather{position:relative;width:min(1240px,100%);height:min(820px,100%);border-radius:26px;padding:20px;
    background:radial-gradient(ellipse at 30% 20%,#6b2d31 0,#4d1e22 45%,#38161a 100%);
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,220,200,.06), inset 0 2px 0 rgba(255,220,200,.08);
    transform:scale(.965);transition:transform .55s cubic-bezier(.2,.8,.2,1)}
  .overlay.show .leather{transform:none}
  .leather::before{content:"";position:absolute;inset:9px;border:1.5px dashed rgba(214,182,128,.55);border-radius:20px;pointer-events:none}
  .paper{position:relative;height:100%;border-radius:12px;background:
      radial-gradient(ellipse at 50% 40%,rgba(255,250,240,.55),rgba(255,250,240,0) 60%),
      linear-gradient(180deg,#F3E8D6,#EADCC4);
    color:var(--text);box-shadow:inset 0 0 60px rgba(120,80,40,.22);overflow:hidden}
  .x{position:absolute;top:14px;right:14px;z-index:3;width:40px;height:40px;border-radius:50%;border:1px solid rgba(61,43,32,.2);background:rgba(245,235,221,.8);color:var(--text);display:inline-flex;align-items:center;justify-content:center}
  .x:hover{background:#fff}

  /* ── 화면 3: 상세 ── */
  .detail .paper{display:grid;grid-template-columns:220px 1fr 64px}
  .d-nav{background:linear-gradient(180deg,#3b2219,#2c1912);color:var(--parch);padding:46px 0 24px;display:flex;flex-direction:column}
  .d-nav ol{list-style:none;margin:0;padding:0 0 0 26px;flex:1;overflow:auto}
  .d-nav li button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px 10px 0;border:0;background:none;color:#bfae92;font-size:14.5px;text-align:left}
  .d-nav li button::before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid rgba(182,154,100,.5);flex-shrink:0}
  .d-nav li button.on{color:#F5EBDD;font-weight:700}
  .d-nav li button.on::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 3px rgba(182,154,100,.18)}
  .d-nav .back{margin:16px 26px 0;border:0;background:none;color:#cdbb9c;font-size:13.5px;text-align:left;display:flex;gap:6px;align-items:center}
  .d-nav .back:hover{color:#fff}
  .d-body{overflow-y:auto;padding:52px 56px 90px;scroll-behavior:smooth}
  .d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .tagpill{display:inline-block;padding:4px 14px;border:1px solid currentColor;border-radius:999px;font-family:var(--en);font-weight:600;font-size:14px;letter-spacing:.1em}
  .labelpill{flex-shrink:0;padding:6px 14px;border-radius:999px;background:rgba(61,43,32,.08);color:#5d4634;font-size:13px}
  .d-body h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,2.6vw,38px);line-height:1.3;margin:16px 0 8px;color:#2d1f17}
  .d-body .sub{font-size:16.5px;line-height:1.7;color:#5a4433;margin:0 0 6px;max-width:640px}
  .d-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .d-tags span{font-size:13px;padding:5px 12px;border-radius:999px;background:rgba(182,154,100,.18);color:#5a4433}
  .sec{padding:38px 0 6px;border-top:1px solid rgba(61,43,32,.12);margin-top:34px;scroll-margin-top:20px}
  .sec .no{font-family:var(--en);font-weight:600;font-size:15px;letter-spacing:.14em;color:#9a7b4c}
  .sec h2{font-family:var(--serif);font-weight:600;font-size:23px;margin:6px 0 12px;color:#2d1f17;display:flex;align-items:center;gap:10px}
  .sec h2::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid #8a6a40}
  .sec p{font-size:16px;line-height:1.85;color:var(--text);margin:0;white-space:pre-line;max-width:720px}
  .sec p.ph{color:#9b8468;font-style:italic}
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:18px}
  .shot{border-radius:12px;overflow:hidden;background:rgba(61,43,32,.05);border:1px dashed rgba(61,43,32,.3);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#8f785d;font-size:13.5px}
  .shot img{width:100%;height:100%;object-fit:cover;display:block}
  .shot.has{border:1px solid rgba(61,43,32,.15);box-shadow:0 8px 20px -10px rgba(61,43,32,.4)}
  .shot svg{width:38px;height:38px;opacity:.55}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chips span{padding:7px 14px;border-radius:999px;border:1px solid rgba(61,43,32,.25);font-size:14px;color:#3d2b20;background:rgba(255,250,240,.5)}
  .d-rail{display:flex;flex-direction:column;align-items:center;padding:70px 0 30px;gap:12px;border-left:1px solid rgba(61,43,32,.1)}
  .d-rail .cnt{font-family:var(--en);font-size:16px;color:#5a4433;writing-mode:horizontal-tb}
  .d-rail .trk{flex:1;width:2px;background:rgba(61,43,32,.15);border-radius:2px;position:relative}
  .d-rail .trk i{position:absolute;left:0;top:0;width:100%;background:#8a6a40;border-radius:2px;transition:height .25s}
  .d-next{position:absolute;right:86px;bottom:22px;z-index:2}
  .d-next .pill{background:rgba(245,235,221,.9);color:var(--text);border-color:rgba(61,43,32,.25)}
  .d-next .pill:hover{background:#fff;color:#000}

  /* ── 화면 4: 목차 ── */
  .toc .paper{padding:40px 54px 30px;display:flex;flex-direction:column}
  .toc h2{font-family:var(--serif);font-weight:600;font-size:28px;color:#2d1f17;text-align:center;margin:0 0 26px;display:flex;align-items:center;justify-content:center;gap:18px}
  .toc h2::before,.toc h2::after{content:"";flex:0 1 200px;height:1px;background:linear-gradient(90deg,transparent,#a88a58)}
  .toc h2::after{transform:scaleX(-1)}
  .toc-grid{flex:1;overflow:auto;display:grid;grid-template-columns:190px 1fr;gap:0 34px;align-content:start}
  .toc-tab{grid-column:1;display:flex;align-items:center;justify-content:center;height:52px;margin:6px 0;border-radius:10px 4px 4px 10px;border:0;color:#F5EBDD;font-family:var(--en);font-weight:600;font-size:17px;letter-spacing:.12em;box-shadow:0 3px 0 rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.18);transition:transform .2s, box-shadow .2s, filter .2s;filter:saturate(.85) brightness(.95)}
  .toc-tab:hover{transform:translateX(6px);filter:none}
  .toc-tab.cur{transform:translateX(12px);filter:none;box-shadow:0 10px 22px -6px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25)}
  .toc-row{grid-column:2;display:grid;grid-template-columns:1fr 64px 92px 30px;align-items:center;gap:14px;min-height:52px;margin:6px 0;padding:6px 14px;border:0;border-bottom:1px solid rgba(61,43,32,.12);border-radius:8px;background:none;text-align:left;color:var(--text)}

/* 넘어가는 종이 모양: 바깥쪽이 늦게 따라오며 휘어짐 */

function shapeLeaf(theta, dir, yBase) {

  for (let i = 0; i <= ROWS; i++) {
    const v = i / ROWS, twist = (v - 0.5) * 0.22 * Math.sin(theta) * dir;
    let x = 0, y = 0;
    for (let j = 0; j <= COLS; j++) {

      const dip = gutter(u) * (1 - easeIO(Math.min(1, (dir > 0 ? theta : Math.PI - theta) / 0.5)));

}

function setPageTextures(left, right) {

}
function startFlip(to) {

    leafFrontMat.map = pageTex(cur, 'R'); leafBackMat.map = pageTex(to, 'L');
    setPageTextures(null, to);
  } else {
    leafFrontMat.map = pageTex(to, 'R'); leafBackMat.map = pageTex(cur, 'L');
    setPageTextures(to, null);

function openReader(target) {
  readerOn = true;
  $('rTabs').innerHTML = PROJECTS.map((p, pi) => `<button data-pi="${pi}" style="background:${esc(p.color || '#5B2529')}">${esc(p.about ? 'ABOUT' : p.toolbox ? 'TOOLBOX' : (p.kind || '').replace(/·.*$/, '').trim())}</button>`).join('');
  $('rTrack').innerHTML = SHEETS.map(cardHTML).join('');
  $('rTabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => scrollReader(firstOf(Number(b.dataset.pi)))));
  $('rTrack').querySelectorAll('.more').forEach(b => b.addEventListener('click', () => openDetail(Number(b.dataset.pi))));
  $('reader').classList.add('show'); $('landing').classList.add('out');
  requestAnimationFrame(() => { scrollReader(target || 0, true); $('rTrack').dispatchEvent(new Event('scroll')); });
}
function closeReader() { readerOn = false; $('reader').classList.remove('show'); $('landing').classList.remove('out'); }
function scrollReader(gi, instant) { const tr = $('rTrack'); tr.scrollTo({ left: gi * tr.clientWidth, behavior: instant || REDUCED ? 'auto' : 'smooth' }); }
$('rTrack').addEventListener('scroll', () => {
  const tr = $('rTrack'), gi = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
  if (gi !== cur) { cur = Math.max(0, Math.min(NS - 1, gi)); markViewed(cur); play('page'); }
  $('rNum').textContent = `${cur + 1} / ${NS}`;
  $('rTabs').querySelectorAll('button').forEach(b => b.classList.toggle('cur', Number(b.dataset.pi) === SHEETS[cur].pi));
}, { passive: true });
$('rPrev').addEventListener('click', () => scrollReader(Math.max(0, cur - 1)));
$('rNext').addEventListener('click', () => cur >= NS - 1 ? openThanks() : scrollReader(cur + 1));
$('rToc').addEventListener('click', openToc);
$('rClose').addEventListener('click', closeReader);

/* ───────────── 입력: 키보드 · 휠 · 터치 · 클릭 ───────────── */
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (!$('contactPop').hidden) { closePop(); return; }
    if (overlayOn) { hideOverlays(); return; }
    if (readerOn) { closeReader(); return; }
    if (mode === 'open') closeBook();
    return;
  }
  if (overlayOn) return;
  if (e.target.closest && e.target.closest('input, textarea')) return;
  if (readerOn) { if (e.key === 'ArrowRight') $('rNext').click(); if (e.key === 'ArrowLeft') $('rPrev').click(); return; }
  if (mode === 'landing' && ['Enter', ' ', 'ArrowDown', 'ArrowRight'].includes(e.key) && document.activeElement === document.body) { e.preventDefault(); openBook(); return; }
  if (mode !== 'open') return;
  if (['ArrowRight', 'PageDown'].includes(e.key)) { e.preventDefault(); go(1); }
  if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(-1); }
  if (e.key === 't' || e.key === 'T') openToc();
  if (e.key === 'd' || e.key === 'D' || (e.key === 'Enter' && document.activeElement === document.body)) openDetail(SHEETS[cur].pi);
});
let wheelLock = 0;
window.addEventListener('wheel', e => {
  if (overlayOn || readerOn) return;
  const now = performance.now(); if (now < wheelLock) return;
  if (mode === 'landing' && e.deltaY > 20) { wheelLock = now + 900; openBook(); return; }
  if (mode === 'open' && Math.abs(e.deltaY) > 20) { wheelLock = now + 650; go(e.deltaY > 0 ? 1 : -1); }
}, { passive: true });
let touch = null;
canvas.addEventListener('touchstart', e => { touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: performance.now() }; }, { passive: true });
canvas.addEventListener('touchend', e => {
  if (!touch) return; const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y; touch = null;
  if (mode === 'open' && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
});

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(-9, -9);
let hovering = false, hoverTab = -1, hoverY = 0, clickTimer = 0;
canvas.addEventListener('pointermove', e => { mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1); });
canvas.addEventListener('pointerleave', () => mouse.set(-9, -9));
function pick() {
  ray.setFromCamera(mouse, camera);
  const h = ray.intersectObjects(clickables.filter(m => m.visible), false)[0];
  return h ? h.object : null;
}
canvas.addEventListener('click', e => {
  mouse.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  const o = pick();
  if (mode === 'landing') { if (o) openBook(); return; }
  if (mode !== 'open' || !o) return;
  if (tabs.includes(o)) { startFlip(firstOf(o.userData.pi)); return; }
  // 오른쪽 면 클릭 → 다음 장, 왼쪽 면 → 이전 장 / 페이지를 두 번 누르면 상세 보기
  const p = new THREE.Vector3(); ray.intersectObject(o, false)[0] && book.worldToLocal(p.copy(ray.intersectObject(o, false)[0].point));
  clearTimeout(clickTimer);
  if (e.detail >= 2) { openDetail(SHEETS[cur].pi); return; }
  clickTimer = setTimeout(() => { if (p.x > 0.08) go(1); else if (p.x < -0.08) go(-1); }, 240);
});
canvas.addEventListener('dblclick', e => e.preventDefault());

function resize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  landingPlacement();
  if (readerOn && !isMobile()) { closeReader(); }
}
window.addEventListener('resize', resize);

/* ───────────── 루프 ───────────── */
const clock = new THREE.Clock();
const tmpP = new THREE.Vector3(), tmpL = new THREE.Vector3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), now = performance.now(), t = clock.elapsedTime;
  updateOpen(now);
  const tabsOn = applyOpen(openT);
  if (!flip && mode !== 'opening') layoutStacks(tL(cur));
  updateFlip(now);

  /* 마우스 오버: 랜딩에서는 수첩이 살짝 떠오르며 빛남 · 펼친 뒤에는 책갈피가 살짝 나옴 */
  const o = mouse.x > -2 && !overlayOn ? pick() : null;
  hovering = !!o && (mode === 'landing' || (mode === 'open' && (tabs.includes(o) || o === pageRight || o === pageLeft)));
  canvas.classList.toggle('hover', hovering);
  hoverTab = o && tabs.includes(o) ? o.userData.pi : -1;
  const lift = mode === 'landing' && hovering ? 0.03 : 0;
  hoverY += (lift - hoverY) * Math.min(1, dt * 8);
  book.position.y = hoverY;
  hoverLight.position.set(book.position.x + 0.6, 1.4, book.position.z + 0.9);
  hoverLight.intensity += ((mode === 'landing' && hovering ? 2.2 : 0) - hoverLight.intensity) * Math.min(1, dt * 6);
  tabs.forEach(tb => {
    const goal = (tb.userData.cur ? 0.07 : 0) + (hoverTab === tb.userData.pi ? 0.04 : 0);
    tb.userData.out += (goal - tb.userData.out) * Math.min(1, dt * 10);
    const tr = BLOCK - stackL;
    tb.position.set(PW + 0.13 + tb.userData.out, BT + tr * 0.5 + 0.004, tb.userData.z);
    tb.scale.setScalar(Math.max(0.001, tabsOn));
  });

  /* 카메라 */
  camLanding(tmpP, tmpL);
  camOpen(camGoal, lookGoal);
  const k = mode === 'landing' ? 0 : (mode === 'opening' || mode === 'closing') ? easeIO(openT) : 1;
  camGoal.lerpVectors(tmpP, camGoal, k); lookGoal.lerpVectors(tmpL, lookGoal, k);
  zoomT += (zoomGoal - zoomT) * Math.min(1, dt * 4);
  if (zoomT > 0.001) { camZoom(tmpP, tmpL); camGoal.lerp(tmpP, easeIO(zoomT)); lookGoal.lerp(tmpL, easeIO(zoomT)); }
  if (camPos.lengthSq() === 0) { camPos.copy(camGoal); camLook.copy(lookGoal); }
  const s = mode === 'opening' || mode === 'closing' ? 1 : Math.min(1, dt * 4);
  camPos.lerp(camGoal, s); camLook.lerp(lookGoal, s);
  // 아주 미세한 호흡 (정적인 화면에 생기)
  camera.position.set(camPos.x + Math.sin(t * 0.21) * 0.01, camPos.y, camPos.z + Math.cos(t * 0.17) * 0.01);
  camera.lookAt(camLook);

  /* 랜딩 문구는 책 오른쪽에 · 펼친 상태에서는 하단 정보 */
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

/* ───────────── 시작 ───────────── */
async function loadFonts() {
  const words = [JSON.stringify(CFG), 'About Me PORTFOLIO NOTEBOOK CONTENTS MVP — 0123456789 [대표 이미지] [화면 이미지 자리] [설명을 적어 주세요] [사진 또는 일러스트]'].join(' ');
  const specs = [`400 32px ${SANS}`, `500 32px ${SANS}`, `600 32px ${SERIF}`, `700 32px ${SERIF}`, `400 60px ${SCRIPT}`, `600 30px ${EN}`, `italic 600 80px ${EN}`, `italic 500 28px ${EN}`, `700 40px ${EN}`, `500 18px ${MONO}`];
  await new Promise(r => { const l = document.querySelector('link[rel=stylesheet]'); if (!l || l.sheet) r(); else { l.addEventListener('load', r); l.addEventListener('error', r); setTimeout(r, 3000); } });
  await Promise.race([Promise.all(specs.map(s => document.fonts.load(s, words).catch(() => null))), new Promise(r => setTimeout(r, 4500))]);
}
(async () => {
  await Promise.all([loadFonts(), loadImages()]);
  build();
  landingPlacement();
  layoutStacks(tL(0));
  setPageTextures(0, 0);
  onPageChange();
  setSound(soundOn);
  resize();
  applyOpen(0);
  camLanding(camPos, camLook);
  frame();
  $('loader').classList.add('done');
})();
</script>
